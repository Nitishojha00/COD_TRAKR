<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup | CodeTracker</title>

  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Google Fonts (same as portfolio) -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <style>
    /* ----- THEME VARIABLES (matching portfolio) ----- */
    :root {
      --bg: #f7f5f2;
      --ink: #1a1a1a;
      --muted: #888;
      --accent: #2d6a4f;
      --accent-light: #d8f3dc;
      --border: #e0ddd8;
      --card-bg: #ffffff;
      --nav-h: 64px;
    }

    body.dark {
      --bg: #212428;
      --ink: #fcfdff;
      --muted: #f8f8f8;
      --accent: #22c55e;
      --accent-light: #241f1f;
      --border: #0f1011;
      --card-bg: #19191a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.2s, color 0.2s;
    }

    /* Theme toggle button (floating) */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink);
      transition: all 0.2s;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .theme-toggle:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Card style */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }

    h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 28px;
      color: var(--ink);
      font-weight: 500;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 16px;
    }

    input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      color: var(--ink);
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 40px;
      border: none;
      background: var(--ink);
      color: var(--bg);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    button:hover {
      transform: translateY(-1px);
      background: #333;
    }

    .link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--muted);
    }

    .link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .link a:hover {
      text-decoration: underline;
    }

    #userExistsMsg {
      display: none;
      margin-bottom: 16px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid #ef4444;
      border-radius: 8px;
      color: #ef4444;
      font-size: 13px;
    }

    #otpBox {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    hr {
      border-color: var(--border);
      margin: 20px 0;
    }
  </style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle">🌙</button>

<div class="card">
  <h2>Create Account</h2>

  <div id="userExistsMsg">
    <i class="fa-solid fa-circle-exclamation"></i> User already exists.
  </div>

  <div class="input-group">
    <i class="fa-regular fa-user"></i>
    <input id="name" placeholder="Full Name">
  </div>

  <div class="input-group">
    <i class="fa-regular fa-envelope"></i>
    <input id="email" placeholder="Email Address">
  </div>

  <div class="input-group">
    <i class="fa-solid fa-lock"></i>
    <input id="password" type="password" placeholder="Password">
  </div>

  <button onclick="generateOTP()">Generate OTP</button>

  <div id="otpBox">
    <div class="input-group">
      <i class="fa-solid fa-key"></i>
      <input id="otp" placeholder="Enter 6-digit OTP">
    </div>
    <button onclick="verifyOTP()">Verify OTP</button>
  </div>

  <div class="link">
    Already registered? <a href="login.html">Login here</a>
  </div>
</div>

<script>
  const API = "http://127.0.0.1:4000";
  axios.defaults.withCredentials = true;
  let signupId = null;

  async function generateOTP() {
    try {
      const res = await axios.post(`${API}/api/auth/signup-generate-otp`, {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      });
      signupId = res.data.signupId;
      document.getElementById("userExistsMsg").style.display = "none";
    } catch (err) {
      const msg = err.response?.data;
      if (msg === "User already registered") {
        document.getElementById("userExistsMsg").style.display = "block";
      } else {
        document.getElementById("userExistsMsg").style.display = "none";
      }
      console.log(msg || err);
    }
  }

  async function verifyOTP() {
    try {
      await axios.post(`${API}/api/auth/signup-verify-otp`, {
        signupId,
        otp: document.getElementById("otp").value
      });
      window.location.href = "dashboard.html";
    } catch (err) {
      console.log(err.response?.data || err);
    }
  }

  // Dark mode toggle (matches portfolio)
  const toggleBtn = document.getElementById("theme-toggle");
  toggleBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    toggleBtn.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
  });
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    toggleBtn.textContent = "☀️";
  }
</script>
</body>
</html>
