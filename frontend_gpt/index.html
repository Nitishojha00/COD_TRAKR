<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Signup</title>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:#0d0d0d;color:white}

.container{display:flex;height:100vh}

/* LEFT */
.left{
  flex:1;
  background:linear-gradient(180deg,#000,#111);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px
}
.left h1{font-size:48px}
.left span{color:#777}
.left p{color:#aaa}

/* RIGHT */
.right{flex:1;display:flex;align-items:center;justify-content:center}

.card{
  width:360px;
  padding:30px;
  background:#111;
  border:1px solid #222;
  border-radius:12px
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  background:#0a0a0a;
  border:1px solid #222;
  color:white
}

button{
  width:100%;
  padding:12px;
  background:white;
  color:black;
  border:none;
  font-weight:600;
  cursor:pointer
}

button:hover{opacity:0.85}

.link{text-align:center;color:#888;margin-top:10px}
#userExistsMsg{color:#ff4d4d;display:none}
</style>
</head>

<body>

<div class="container">

<div class="left">
  <h1>COD<span>TRAKR</span></h1>
  <p>Track your coding journey like a pro 🚀</p>
</div>

<div class="right">
<div class="card">
<h2>Create Account</h2>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div id="userExistsMsg">User already exists</div>

<button onclick="generateOTP()">Generate OTP</button>

<div id="otpBox">
<input id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify OTP</button>
</div>

<p class="link">Already have account? <a href="login.html">Login</a></p>
</div>
</div>

</div>

<script>
const API="http://127.0.0.1:4000";
axios.defaults.withCredentials=true;

let signupId=null;

async function generateOTP(){
 try{
  const res=await axios.post(`${API}/api/auth/signup-generate-otp`,{
   name:document.getElementById("name").value,
   email:document.getElementById("email").value,
   password:document.getElementById("password").value
  });
  signupId=res.data.signupId;
  document.getElementById("userExistsMsg").style.display="none";
 }catch(err){
  if(err.response?.data==="User already registered"){
    document.getElementById("userExistsMsg").style.display="block";
  }
 }
}

async function verifyOTP(){
 try{
  await axios.post(`${API}/api/auth/signup-verify-otp`,{
    signupId,
    otp:document.getElementById("otp").value
  });
  window.location.href="dashboard.html";
 }catch(err){
  console.log(err);
 }
}
</script>

</body>
</html>
