<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dashboard | Coding Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif}

body{
  background:#0d0d0d;
  color:white;
  margin:0;
}

/* TOPBAR */
.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:20px 30px;
 border-bottom:1px solid #222;
}

.topbar span{
 color:#aaa;
}

/* CONTAINER */
.container{
 max-width:1100px;
 margin:auto;
 padding:20px;
}

/* CARDS */
.card{
 background:#111;
 border:1px solid #222;
 border-radius:12px;
 padding:20px;
 margin-bottom:20px;
}

/* INPUTS */
.inputs{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
 margin-top:10px;
}

input{
 background:#0a0a0a;
 border:1px solid #222;
 color:white;
 padding:10px;
 border-radius:6px;
}

/* BUTTON */
button{
 background:white;
 color:black;
 border:none;
 padding:10px;
 cursor:pointer;
 border-radius:6px;
 margin-top:10px;
}

/* STATS */
.stats-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:20px;
}

.stat-box{
 background:#0a0a0a;
 border:1px solid #222;
 padding:20px;
 border-radius:10px;
 text-align:center;
}

.stat-box h2{
 margin:5px 0;
}
</style>
</head>

<body>

<!-- ✅ CORRECT PLACE -->
<header class="topbar">
  <div>
    Welcome, <span id="user">...</span>
  </div>
  <div>
    <a href="Notes.html" style="color:#aaa;margin-right:15px">Notes</a>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

  <div class="card">
    <h3>Link Coding Accounts</h3>
    <small>Enter only username</small>

    <div class="inputs">
      <input id="lc" placeholder="LeetCode">
      <input id="cf" placeholder="Codeforces">
      <input id="cc" placeholder="CodeChef">
      <input id="gfg" placeholder="GFG">
    </div>

    <button onclick="saveAccounts()">Save Accounts</button>
  </div>

  <div class="card">
    <h3>Overall Performance</h3>
    <div class="stats-grid">
      <div class="stat-box"><p>Total Problems</p><h2 id="totalSolved">0</h2></div>
      <div class="stat-box"><p>Total Contests</p><h2 id="totalContests">0</h2></div>
      <div class="stat-box"><p>Best Rating</p><h2 id="bestRating">0</h2></div>
      <div class="stat-box"><p>Platforms</p><h2 id="platformCount">0</h2></div>
    </div>
  </div>

  <div class="card">
    <h3>Platform-wise Statistics</h3>
    <div id="platformStats">Loading...</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
const API="http://127.0.0.1:4000";
axios.defaults.baseURL=API;
axios.defaults.withCredentials=true;

const totalSolvedEl=document.getElementById("totalSolved");
const totalContestsEl=document.getElementById("totalContests");
const bestRatingEl=document.getElementById("bestRating");
const platformCountEl=document.getElementById("platformCount");
const platformStats=document.getElementById("platformStats");

const lcInput=document.getElementById("lc");
const cfInput=document.getElementById("cf");
const ccInput=document.getElementById("cc");
const gfgInput=document.getElementById("gfg");

async function loadUser(){
 try{
  const res=await axios.get("/api/dashboard/me");
  document.getElementById("user").innerText=res.data.name;

  const p=res.data.platforms||{};
  lcInput.value=p.LeetCode?.username||"";
  cfInput.value=p.Codeforces?.username||"";
  ccInput.value=p.CodeChef?.username||"";
  gfgInput.value=p.GFG?.username||"";

  await loadStats();
 }catch{
  logout();
 }
}

async function loadStats(){
 try{
  const res=await axios.get("/api/dashboard/dashboard");
  updateDashboardUI(res.data);
 }catch{
  platformStats.innerHTML="<p style='color:red'>Failed</p>";
 }
}

async function saveAccounts(){
 const platforms={};

 if(lcInput.value) platforms.LeetCode={username:lcInput.value};
 if(cfInput.value) platforms.Codeforces={username:cfInput.value};
 if(ccInput.value) platforms.CodeChef={username:ccInput.value};
 if(gfgInput.value) platforms.GFG={username:gfgInput.value};

 try{
  await axios.post("/api/dashboard/accounts",{platforms});
  alert("Saved");
  await loadStats();
 }catch{
  alert("Error");
 }
}

function updateDashboardUI(data){
 const {platforms,totalSolved,totalContests,bestRating,platformCount}=data;

 totalSolvedEl.innerText=totalSolved;
 totalContestsEl.innerText=totalContests;
 bestRatingEl.innerText=bestRating;
 platformCountEl.innerText=platformCount;

 let html="";
 for(let p in platforms){
  const s=platforms[p];
  if(!s.username) continue;

  html+=`
  <div style="margin-top:20px">
    <h4>${p}</h4>
    <div class="stats-grid">
      <div class="stat-box"><p>Solved</p><h3>${s.solved||0}</h3></div>
      <div class="stat-box"><p>Contests</p><h3>${s.contests||0}</h3></div>
      <div class="stat-box"><p>Rating</p><h3>${s.rating||0}</h3></div>
      <div class="stat-box"><p>Rank</p><h3>${s.rank||0}</h3></div>
    </div>
  </div>`;
 }
 platformStats.innerHTML=html;
}

async function logout(){
 try{await axios.post("/logout");}catch{}
 window.location.replace("login.html");
}

loadUser();
</script>

</body>
</html>
