<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Problem Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- COPY ALL YOUR ROOT VARIABLES AND BASE STYLES HERE (Keep them same) --- */
:root {
 --primary:#fff;
 --bg-dark:#0d0d0d;
 --bg-card:#111;
 --text-light:#fff;
 --text-muted:#888;
 --border:#222;
 --gold:#ffd700;
 --danger:#ff4d4d;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background-color: var(--bg-dark); color: var(--text-light); height: 100vh; overflow: hidden; }
.app-container { display: flex; height: 100%; position: relative; }

/* --- SIDEBAR --- */
.sidebar {
    width: 260px;
    background-color: var(--bg-card);
    border-right: 1px solid var(--border);
    padding: 24px;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
    z-index: 50;
}

/* Mobile Toggle Button (Hidden on Desktop) */
.mobile-menu-btn {
    display: none;
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 40;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* --- KEEP YOUR EXISTING SIDEBAR & MAIN CONTENT STYLES HERE --- */
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; color: var(--primary); font-size: 1.2rem; }
.nav-links { display: flex; flex-direction: column; gap: 8px; }
.nav-btn { background: transparent; border: none; color: var(--text-muted); text-align: left; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 15px; transition: all 0.2s; font-weight: 500; }
.nav-btn:hover, .nav-btn.active { background-color: rgba(99, 102, 241, 0.1); color: var(--primary); }
.filter-section { margin-top: 32px; }
.star-filters { display: flex; flex-direction: column; gap: 6px; }
.star-btn { background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 14px; }
.star-btn:hover { background: rgba(255,255,255,0.03); color: var(--text-light); }
.text-gold { color: var(--gold); margin-right: 8px; }
.add-new-btn { margin-top: auto; background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }

/* MAIN CONTENT */
.main-content { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; width: 100%; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
.search-box { background: var(--bg-card); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; width: 320px; }
.search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 14px; }

/* TABLE */
.table-container { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 16px 24px; text-align: left; border-bottom: 1px solid var(--border); }
th { background-color: rgba(255,255,255,0.02); color: var(--text-muted); font-size: 13px; text-transform: uppercase; }
tr:hover { background-color: rgba(255,255,255,0.02); }
.tag-badge { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin-right: 6px; display: inline-block; }
.link-icon { color: var(--text-muted); text-decoration: none; font-size: 14px; }
.action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; font-size: 16px; }
.delete-btn:hover { color: var(--danger); }
.edit-btn:hover { color: var(--primary); }

/* --- MODAL (Fixed & Responsive) --- */
.modal {
    display: none; /* JS toggles this to flex */
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(5px);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    background-color: var(--bg-card);
    border-radius: 16px;
    border: 1px solid var(--border);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
    width: 600px; /* Default for create form */
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* Full Screen View Card */
.modal-content.view-card-large {
    width: 95%;
    height: 90%;
    max-width: 1200px;
    padding: 0;
    display: flex;
    flex-direction: column;
}

.modal-header-fixed {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    background-color: rgba(15, 23, 42, 0.95);
    display: flex;
    justify-content: space-between;
    align-items: start;
    border-radius: 16px 16px 0 0;
}

.modal-body { padding: 32px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 32px; }

/* Typography for Modal */
.big-title { font-size: 32px; font-weight: 700; color: white; margin-bottom: 8px; line-height: 1.2; }
.meta-info { font-size: 14px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: 12px; font-weight: 700; }
.text-content { font-size: 16px; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; }
.note-box-wide { background: rgba(99, 102, 241, 0.05); border: 1px solid rgba(99, 102, 241, 0.2); padding: 24px; border-radius: 12px; }
.mistake-box-wide { background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); padding: 24px; border-radius: 12px; }

/* Close Buttons */
.close { position: absolute; right: 20px; top: 20px; cursor: pointer; font-size: 24px; color: var(--text-muted); }
.close-massive { font-size: 32px; color: var(--text-muted); cursor: pointer; }
.close-massive:hover { color: white; }

/* Solve Button */
.solve-btn-massive {
    background-color: var(--primary); color: white; padding: 10px 24px; font-size: 16px; 
    font-weight: 600; border-radius: 8px; text-decoration: none; white-space: nowrap;
}

/* Form Styles */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; }
.form-group input, .form-group select, .form-group textarea {
    width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; outline: none;
}
.row { display: flex; gap: 16px; }
.half { flex: 1; }
.submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }

/* Loader & Pagination */
.loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
.pagination { display: flex; justify-content: flex-end; gap: 16px; margin-top: 24px; }
.pagination button { background: var(--bg-card); border: 1px solid var(--border); color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* --- 🔥 RESPONSIVE MOBILE STYLES 🔥 --- */
@media (max-width: 768px) {
    /* 1. Sidebar becomes a slide-out drawer */
    .sidebar {
        position: fixed;
        left: -100%; /* Hidden by default */
        top: 0;
        height: 100%;
        width: 80%;
        max-width: 300px;
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }
    .sidebar.active { left: 0; }
    
    /* Show Toggle Button */
    .mobile-menu-btn { display: block; }
    
    /* Adjust main content padding to make room for toggle btn */
    .main-content { padding: 70px 16px 20px 16px; width: 100%; }
    .search-box { width: 100%; }

    /* 2. Table: Hide columns as requested */
    th:nth-child(1), td:nth-child(1), /* ID */
    th:nth-child(3), td:nth-child(3), /* Tags */
    th:nth-child(4), td:nth-child(4), /* Importance */
    th:nth-child(5), td:nth-child(5), /* Link */
    th:nth-child(6), td:nth-child(6)  /* Actions */
    { display: none; }
    
    /* Ensure Problem Name (Col 2) is visible and takes full width */
    th:nth-child(2), td:nth-child(2) {
        display: table-cell;
        width: 100%;
    }

    /* 3. Modal Adjustments for Phone */
    .modal-content.view-card-large { width: 100%; height: 100%; border-radius: 0; }
    .modal-header-fixed { flex-direction: column; gap: 16px; padding: 20px; }
    .big-title { font-size: 24px; }
    .meta-info { gap: 8px; font-size: 12px; }
    .modal-body { padding: 20px; }
    .solve-btn-massive { width: 100%; text-align: center; }
    .row { flex-direction: column; gap: 0; }
    .modal-content { width: 95%; margin: auto; }
}


/* Add this utility class to hide the loader */
.hidden {
    display: none !important;
}

/* Optional: Make the search icon look clickable */
.search-btn-icon {
    cursor: pointer;
    padding: 8px;
    color: var(--text-muted);
    transition: 0.2s;
}
.search-btn-icon:hover {
    color: var(--primary);
    transform: scale(1.1);
}
/* Add this to your CSS file */

.action-bar-modal {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap; /* Allows wrapping on very small phones */
}

.icon-btn-modal {
    flex: 1; /* Takes equal width */
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    min-width: 100px;
}

/* Specific Mobile Adjustment for Modal Buttons */
@media (max-width: 768px) {
    .action-bar-modal {
        flex-direction: column; /* Stack buttons vertically on phone */
    }
    .solve-btn-massive {
        width: 100%;
        padding: 15px;
        font-size: 18px;
    }
}
    </style>
</head>
    <body>
        <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="app-container">
            <aside class="sidebar" id="sidebar"> 
                <div class="brand">
                    <i class="fa-solid fa-code"></i>
                    <h2>DSA Tracker</h2>
                    <i class="fa-solid fa-times" style="margin-left:auto; cursor:pointer; display:none;" onclick="toggleSidebar()" id="sidebarClose"></i>
                </div>
                
                <nav class="nav-links">
                    <button class="nav-btn active" onclick="loadView('importance'); toggleSidebar()">
                        <i class="fa-solid fa-fire"></i> Top Priority
                    </button>
                    <button class="nav-btn" onclick="loadView('all'); toggleSidebar()">
                        <i class="fa-solid fa-layer-group"></i> All Problems
                    </button>
                </nav>

                <div class="filter-section">
                    <h3>Filter by Stars</h3>
                    <div class="star-filters">
                        <button onclick="filterByStars(3); toggleSidebar()" class="star-btn"><i class="fa-solid fa-star text-gold"></i> 3 Stars</button>
                        <button onclick="filterByStars(2); toggleSidebar()" class="star-btn"><i class="fa-solid fa-star text-gold"></i> 2 Stars</button>
                        <button onclick="filterByStars(1); toggleSidebar()" class="star-btn"><i class="fa-solid fa-star text-gold"></i> 1 Star</button>
                        <button onclick="filterByStars(0); toggleSidebar()" class="star-btn"><i class="fa-solid fa-star text-gold"></i> 0 Star</button>
                    </div>
                </div>

                <button class="add-new-btn" onclick="openCreateModal(); toggleSidebar()">
                    <i class="fa-solid fa-plus"></i> New Problem
                </button>
                <a href="dashboard.html" >
             <button class="add-new-btn" style="margin: 30px;">
                 DashBoard
            </button>
            </a>
            <button class="add-new-btn" onclick="logout()" style="background-color: red;">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out
            </button>
            </aside>

            <main class="main-content">
                <header>
                    <h1 id="page-title">Dashboard</h1>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass search-btn-icon" id="searchIconBtn"></i>
                        <input type="text" id="tagSearchInput" placeholder="Search by tag (e.g. array)...">
                    </div>
                </header>
                
                <div id="loader" class="loader hidden"></div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th width="5%">ID</th>
                                <th width="30%">Problem Name</th> <th width="20%">Tags</th>
                                <th width="15%">Importance</th>
                                <th width="10%">Link</th>
                                <th width="10%">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="problemTableBody"></tbody>
                    </table>
                </div>

                <div class="pagination">
                    <button id="prevBtn">Previous</button>
                    
                    <span id="pageIndicator"></span>
                    
                    <button id="nextBtn">Next</button>
                </div>

            </main>
        </div>

        <div id="createModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('createModal')">&times;</span>
                <h2 id="modalTitle">Add New Problem</h2>
                <form id="createForm">
                    <input type="hidden" name="problemId" id="editProblemId">

                    <div class="row">
                        <div class="form-group half">
                            <label>Problem Name *</label>
                            <input type="text" name="problemName" id="inpName" required>
                        </div>
                        <div class="form-group half">
                            <label>Problem Link</label>
                            <input type="url" name="problemLink" id="inpLink">
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group half">
                            <label>Tags (comma separated)</label>
                            <input type="text" name="tags" id="inpTags">
                        </div>
                        <div class="form-group half">
                            <label>Importance</label>
                            <select name="stars" id="inpStars">
                                <option value="0">0 - Lowest</option>
                                <option value="1">1 - Low</option>
                                <option value="2">2 - Medium</option>
                                <option value="3">3 - High</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="problemDescription" id="inpDesc" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Solution / Notes</label>
                        <textarea name="notes" id="inpNotes" rows="4"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Mistakes to Avoid</label>
                        <textarea name="mistake" id="inpMistake" rows="2"></textarea>
                    </div>

                    <button type="submit" class="submit-btn" id="modalSubmitBtn">Save Problem</button>
                </form>
            </div>
        </div>

        <div id="viewModal" class="modal">
            <div class="modal-content view-card-large" id="viewContent"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="scriptNote.js"></script>
    </body>
</html
