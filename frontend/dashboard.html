<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | CodeTracker</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="./style/dashboard.css">
</head>
<body>

<header>
  <div class="user-greeting">
    Welcome, <span id="user">Loading...</span> <i class="fa-regular fa-smile"></i>
  </div>
  <div class="nav-links">
    <a href="Notes.html"><i class="fa-solid fa-note-sticky"></i> Notes</a>
    <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    <button class="theme-toggle" id="theme-toggle">🌙</button>
  </div>
</header>

<div class="container">

  <div class="card">
    <h3><i class="fa-brands fa-github"></i> Link Coding Accounts</h3>
    <small>Enter only your username (not the full URL)</small>
    <div class="inputs-grid">
      <input id="lc" placeholder="LeetCode username">
      <input id="cf" placeholder="Codeforces username">
      <input id="cc" placeholder="CodeChef username">
      <input id="gfg" placeholder="GFG username">
    </div>
    <button onclick="saveAccounts()">Save Accounts</button>
  </div>

  <div class="card">
    <h3><i class="fa-solid fa-chart-simple"></i> Overall Performance</h3>
    <div class="stats-grid">
      <div class="stat-box"><p>Total Problems</p><h2 id="totalSolved">0</h2></div>
      <div class="stat-box"><p>Total Contests</p><h2 id="totalContests">0</h2></div>
      <div class="stat-box"><p>Best Rating</p><h2 id="bestRating">0</h2></div>
      <div class="stat-box"><p>Platforms Linked</p><h2 id="platformCount">0</h2></div>
    </div>
  </div>

  <div class="card">
    <h3><i class="fa-solid fa-chart-line"></i> Platform-wise Statistics</h3>
    <div id="platformStats">Loading...</div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="./script//dashboard.js"></script>
</body>
</html>
